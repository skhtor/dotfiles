# Prefix
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix

# Reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf

# Settings

set -g default-terminal 'xterm-256color'
set -g terminal-overrides ',xterm-256color:RGB'
# set -g pane-active-border-style 'fg=magenta,bg=default'
# set -g pane-border-style 'fg=brightblack,bg=default'

# Mouse & scroll
set -g mouse on
set -g terminal-overrides 'xterm*:XT:Ms=\E]52;%p1%s;%p2%s\007'
bind -T copy-mode-vi WheelUpPane   send -N1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N1 -X scroll-down

set -g history-limit 1000000      # increase history size (from 2,000)
set -g base-index 1               # start indexing windows at 1 instead of 0
set -g detach-on-destroy off      # don't exit from tmux when closing a session
set -g escape-time 0              # zero-out escape time delay
set -g renumber-windows on        # renumber all windows when any window is closed
set -g set-clipboard on           # use system clipboard
set -g status-position top        # macOS / darwin style

# Kill without prompt
bind-key & kill-window
bind-key x kill-pane

# Split panes
unbind %
bind | split-window -h -c "#{pane_current_path}" # vertical split

unbind '"'
bind - split-window -v -c "#{pane_current_path}" # horizontal split

# Resizing pane hotkeys
bind -r h resize-pane -L 5
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r m resize-pane -Z # Maximise

# Vi
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# ~~~~~ PLUGINS ~~~~~

# Tmux TPM
set -g @plugin 'tmux-plugins/tpm'

# Plugins
# Vim/fzf-aware pane switching (replaces vim-tmux-navigator plugin)
is_vim_or_fzf="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?|fzf)(diff)?$'"
bind-key -n C-h if-shell "$is_vim_or_fzf" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim_or_fzf" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim_or_fzf" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim_or_fzf" "send-keys C-l" "select-pane -R"
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @yank_action 'copy-pipe' # or 'copy-pipe-and-cancel' for the default
# set -g @plugin 'fcsonline/tmux-thumbs'

# FZF url
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# Continuum + Resurrect
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'

# Sessionx
set -g @plugin 'omerxx/tmux-sessionx'
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'

# Catppuccin
set -g @plugin 'catppuccin/tmux'
set -g @catppuccin_flavour "mocha"
# set -g @catppuccin_window_number_position "right"
# set -g @catppuccin_window_default_fill "number"
# set -g @catppuccin_window_default_text "#W"
# set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_custom_plugin_dir "$HOME/.config/tmux/plugins/custom"
set -g @catppuccin_status_modules_right "pomodoro date_time"
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_pane_border_style "fg=blue" # Use a value compatible with the standard tmux 'pane-border-style'
set -g @catppuccin_pane_active_border_style "fg=red" # Use a value compatible with the standard tmux 'pane-border-active-style'
# set -g @catppuccin_status_left_separator  " "
# set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "yes"
# set -g @catppuccin_status_connect_separator "no"
# set -g @catppuccin_directory_text "#{b:pane_current_path}"
# set -g @catppuccin_meetings_text "#($HOME/.config/tmux/scripts/cal.sh)"
set -g @catppuccin_date_time_text "%H:%M"

run '~/.tmux/plugins/tpm/tpm'
